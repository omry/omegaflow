name: Node dependency audit

'on':
  schedule:
  - cron: '0 2 * * 1'
  - cron: '0 2 1 */3 *'
  workflow_dispatch:
    inputs:
      audit-kind:
        description: Security fixes only, or security plus routine upgrades for this run.
        type: choice
        default: security
        options:
        - security
        - upgrades

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    uses: hydra-ecosystem/github-actions/.github/workflows/node-audit.yml@241d646f6b83d17aeee2bb97a8c1e1e788eb6099
    with:
      audit-kind: ${{ inputs.audit-kind || 'auto' }}

  pull-request:
    needs: audit
    permissions:
      contents: write
      pull-requests: write
    uses: hydra-ecosystem/github-actions/.github/workflows/node-publish.yml@241d646f6b83d17aeee2bb97a8c1e1e788eb6099
    with:
      validation-passed: ${{ needs.audit.outputs.validation_passed }}
      app-client-id: ${{ vars.NODE_AUDIT_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.NODE_AUDIT_APP_PRIVATE_KEY }}
