blueprint:
  schema: 1
  version: "${omegaflow_version:}"
  requires_reploy: ">=0.7.0.dev1"
  compatibility:
    platforms: [linux/amd64, linux/arm64]

environment:
  id: omegaflow-controller
  base:
    image: mcr.microsoft.com/playwright/python:v1.61.0-noble
    exports:
      python:
        executable: /usr/bin/python3
  packages:
    os: [ffmpeg]
  applications:
    controller:
      packages:
        python:
          requirements: ["omegaflow[browser]==${omegaflow_version:}"]
      executables:
        omegaflow:
          source: python
          binary: omegaflow
  allow_concurrent: "no"
  runtime:
    user: omegaflow
    network:
      public: deny
      local: deny
      ambiguous: require-both
  mounts:
    omegaflow_input:
      target: /omegaflow-input
      writable: false
      update_policy: unmanaged
  commands:
    omegaflow_controller_run:
      executable: controller.omegaflow
      trigger: [controller-run]
      native_command: true
      argv: [controller-run]

docker:
  mounts:
    omegaflow_input:
      extends: environment.mounts.omegaflow_input
      mode: bind
      source: ${studio.run_dir}/reploy/input/controller
