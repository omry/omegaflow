blueprint:
  schema: 1
  version: "${omegaflow_version:}"
  requires_reploy: ">=0.7.0.dev1"
  compatibility:
    platforms: [linux/amd64]

environment:
  id: omegaflow-controller
  base:
    image: debian:bookworm-slim
  applications:
    controller:
      packages:
        tools:
          - tool: asciinema
            version: "3.2.1"
          - tool: playwright
            version: "1.61.0"
            binding: python
            select: [chromium]
        os: [python3, python3-pip, python3-venv, ffmpeg]
        python:
          interpreter:
            command: python
            version: ">=3.11"
            supplier: os
          requirements: ["omegaflow==${omegaflow_version:}"]
      executables:
        asciinema:
          source: os
          binary: asciinema
        omegaflow:
          source: python
          binary: omegaflow
  allow_concurrent: "no"
  runtime:
    user: omegaflow
    network:
      public: deny
      local: deny
      ambiguous: require-both
  mounts:
    omegaflow_input:
      target: /omegaflow-input
      writable: false
      update_policy: unmanaged
  commands:
    omegaflow_controller_run:
      executable: controller.omegaflow
      trigger: [controller-run]
      native_command: true
      argv: [controller-run]

docker:
  mounts:
    omegaflow_input:
      extends: environment.mounts.omegaflow_input
      mode: bind
      source: ${studio.run_dir}/reploy/input/controller
